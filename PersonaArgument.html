<script>
(() => {
  // The page renders a JSON Canvas file (the format Obsidian saves .canvas files in).
  const C = JSON.parse(document.getElementById('canvas-data').textContent);
  const byId = new Map(C.nodes.map(n => [n.id, n]));
  const groups = C.nodes.filter(n => n.type === 'group');
  const cards = C.nodes.filter(n => n.type !== 'group');
  const PRESET = { 1: 'var(--c1)', 2: 'var(--c2)', 3: 'var(--c3)', 4: 'var(--c4)', 5: 'var(--c5)', 6: 'var(--c6)' };
  const colorOf = c => !c ? null : (PRESET[c] || c);
  // Which cards the toggle hides: source cards (cyan) and objection cards (red); abstracts are green.
  const isSource = n => n.color === '5' || n.color === '1';
  const isAbstract = n => n.color === '4';
  const state = { mode: 'all', abs: true, x: 0, y: 0, s: 0.1, touched: false };
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const view = document.getElementById('view'), world = document.getElementById('world'), svg = document.getElementById('edges');

  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/(^|[^*\w])\*(?!\s)(.+?)\*(?!\w)/g, '$1<em>$2</em>');
  function md(t) {
    let h = '', list = false;
    for (const line of t.split('\n')) {
      const m = line.match(/^\s*[-*] (.*)$/);
      if (m) { if (!list) { h += '<ul>'; list = true; } h += '<li>' + inline(m[1]) + '</li>'; continue; }
      if (list) { h += '</ul>'; list = false; }
      if (line.trim()) h += '<p>' + inline(line.trim()) + '</p>';
    }
    return h + (list ? '</ul>' : '');
  }

  const gl = document.getElementById('groups'), nl = document.getElementById('nodes');
  for (const g of groups) {
    const el = document.createElement('div'); el.className = 'canvas-group';
    const c = colorOf(g.color); if (c) { el.style.setProperty('--gc', c); el.style.setProperty('--gfill', `color-mix(in srgb, ${c} 7%, transparent)`); }
    const lab = document.createElement('div'); lab.className = 'canvas-group-label'; lab.textContent = g.label || '';
    lab.addEventListener('click', () => zoomTo(rect(g)));
    el.appendChild(lab); gl.appendChild(el); g.el = el;
  }
  for (const n of cards) {
    const el = document.createElement('div'); el.className = 'canvas-node'; el.dataset.id = n.id;
    const c = colorOf(n.color); if (c) { el.classList.add('themed'); el.style.setProperty('--nc', c); }
    Object.assign(el.style, { left: n.x + 'px', top: n.y + 'px', width: n.width + 'px', height: n.height + 'px' });
    el.innerHTML = '<div class="content">' + (n.type === 'text' ? md(n.text || '') : esc(n.file || n.url || '')) + '</div>';
    nl.appendChild(el); n.el = el;
  }
  for (const e of C.edges) {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    const c = colorOf(e.color); if (c) g.style.setProperty('--ec', c);
    g.innerHTML = '<path class="edge"/><path class="head h1"/><path class="head h0"/>';
    svg.appendChild(g); e.el = g;
  }

  const visible = n => n.type === 'group' || (isAbstract(n) ? state.abs : (!isSource(n) || state.mode === 'all'));
  const rect = n => {
    const a = n.type === 'group' && state.mode === 'arg' && C.argumentOnlyGroups[n.id];
    return a ? { x: a[0], y: a[1], width: a[2], height: a[3] } : n;
  };

    const zm = Math.max(1, Math.min(14, 1 / state.s / 2.2)), L = 9 * zm, W = 5.5 * zm;
    for (const e of C.edges) {
      const a = byId.get(e.fromNode), b = byId.get(e.toNode), show = visible(a) && visible(b);
      e.el.style.display = show ? '' : 'none'; if (!show) continue;
      const fs = e.fromSide || 'right', ts = e.toSide || 'left';
      const p1 = anchor(rect(a), fs), p2 = anchor(rect(b), ts), n1 = NORM[fs], n2 = NORM[ts];
      const arrowTo = e.toEnd !== 'none', arrowFrom = e.fromEnd === 'arrow';
      const q1 = arrowFrom ? [p1[0] + n1[0] * L, p1[1] + n1[1] * L] : p1, q2 = arrowTo ? [p2[0] + n2[0] * L, p2[1] + n2[1] * L] : p2;
      const off = Math.max(40, Math.min(250, Math.hypot(q2[0] - q1[0], q2[1] - q1[1]) * 0.35));
      const [path, h1, h0] = e.el.children;
      path.setAttribute('d', `M${q1[0]},${q1[1]} C${q1[0] + n1[0] * off},${q1[1] + n1[1] * off} ${q2[0] + n2[0] * off},${q2[1] + n2[1] * off} ${q2[0]},${q2[1]}`);
      const head = (p, n) => `M${p[0]},${p[1]} L${p[0] + n[0] * L - n[1] * W},${p[1] + n[1] * L + n[0] * W} L${p[0] + n[0] * L + n[1] * W},${p[1] + n[1] * L - n[0] * W} z`;
      h1.setAttribute('d', arrowTo ? head(p2, n2) : ''); h0.setAttribute('d', arrowFrom ? head(p1, n1) : '');
    }
  }
  function layout() {
    for (const g of groups) { const r = rect(g); Object.assign(g.el.style, { left: r.x + 'px', top: r.y + 'px', width: r.width + 'px', height: r.height + 'px' }); }
    for (const n of cards) n.el.hidden = !visible(n);
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const n of C.nodes) { if (!visible(n)) continue; const r = rect(n); x0 = Math.min(x0, r.x); y0 = Math.min(y0, r.y); x1 = Math.max(x1, r.x + r.width); y1 = Math.max(y1, r.y + r.height); }
    state.bounds = { x: x0, y: y0 - 120, width: x1 - x0, height: y1 - y0 + 120 };
    drawEdges();
  }

  let lastZm = 0;
  function apply() {
    world.style.transform = `translate(${state.x}px,${state.y}px) scale(${state.s})`;
    const zm = Math.max(1, Math.min(14, 1 / state.s / 2.2));
    world.style.setProperty('--zm', zm);
    if (Math.abs(zm - lastZm) > 0.05) { lastZm = zm; drawEdges(); }
    view.classList.toggle('far', state.s < 0.18);
    let sp = 20 * state.s; while (sp < 14) sp *= 2;
    view.style.backgroundSize = `${sp}px ${sp}px`;
    view.style.backgroundPosition = `${state.x}px ${state.y}px`;
  }
  const fitView = r => {
    const vw = view.clientWidth, vh = view.clientHeight, pad = 0.92;
    const s = Math.min(1, (vw * pad) / r.width, ((vh - 70) * pad) / r.height);
    return { s, x: vw / 2 - (r.x + r.width / 2) * s, y: (vh - 60) / 2 - (r.y + r.height / 2) * s };
  };
  let anim = 0;
  function go(t) {
    cancelAnimationFrame(anim);
    if (reduce) { Object.assign(state, t); apply(); return; }
    const f = { x: state.x, y: state.y, s: state.s }, t0 = performance.now(), dur = 380;
    const cx = view.clientWidth / 2, cy = view.clientHeight / 2;
    const wf = [(cx - f.x) / f.s, (cy - f.y) / f.s], wt = [(cx - t.x) / t.s, (cy - t.y) / t.s];
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      const s = Math.exp(Math.log(f.s) + (Math.log(t.s) - Math.log(f.s)) * e);
      state.s = s; state.x = cx - (wf[0] + (wt[0] - wf[0]) * e) * s; state.y = cy - (wf[1] + (wt[1] - wf[1]) * e) * s; apply();
      if (k < 1) anim = requestAnimationFrame(step); else { Object.assign(state, t); apply(); }
    };
    anim = requestAnimationFrame(step);
  }
  const zoomTo = r => { state.touched = true; go(fitView(r)); };
  const fit = () => go(fitView(state.bounds));
  function zoomAt(f, px, py) {
    const s = Math.max(0.02, Math.min(3, state.s * f)); f = s / state.s;
    state.x = px - (px - state.x) * f; state.y = py - (py - state.y) * f; state.s = s; apply();
  }
  const local = ev => { const r = view.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };

  // selection, pan, pinch
  let selected = null;
  const select = el => { if (selected) selected.classList.remove('selected'); selected = el; if (el) el.classList.add('selected'); };
  const ptrs = new Map(); let moved = 0, downEl = null, pinch = null;
  view.addEventListener('pointerdown', ev => {
    if (ev.target.closest('.canvas-group-label')) return;
    state.touched = true; view.setPointerCapture(ev.pointerId); ptrs.set(ev.pointerId, local(ev));
    if (ptrs.size === 1) { moved = 0; downEl = ev.target; view.classList.add('dragging'); cancelAnimationFrame(anim); }
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); moved = 99; }
  });
  view.addEventListener('pointermove', ev => {
    if (!ptrs.has(ev.pointerId)) return;
    const prev = ptrs.get(ev.pointerId), cur = local(ev); ptrs.set(ev.pointerId, cur);
    if (ptrs.size === 1) { state.x += cur[0] - prev[0]; state.y += cur[1] - prev[1]; moved += Math.abs(cur[0] - prev[0]) + Math.abs(cur[1] - prev[1]); apply(); }
    else if (ptrs.size === 2 && pinch) { const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); zoomAt(d / pinch, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pinch = d; }
  });
  const up = ev => {
    if (!ptrs.has(ev.pointerId)) return; ptrs.delete(ev.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (ptrs.size === 0) { view.classList.remove('dragging'); if (moved < 6 && ev.type === 'pointerup') select(downEl && downEl.closest ? downEl.closest('.canvas-node') : null); }
  };
  view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);
  view.addEventListener('dblclick', ev => { const el = ev.target.closest('.canvas-node'); if (el) zoomTo(byId.get(el.dataset.id)); });
  view.addEventListener('wheel', ev => {
    ev.preventDefault(); state.touched = true;
    const [px, py] = local(ev);
    zoomAt(Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.012 : ev.deltaMode === 1 ? 0.05 : 0.0016)), px, py);
  }, { passive: false });

  const centre = () => [view.clientWidth / 2, view.clientHeight / 2];
  document.getElementById('zin').addEventListener('click', () => zoomAt(1.3, ...centre()));
  document.getElementById('zout').addEventListener('click', () => zoomAt(1 / 1.3, ...centre()));
  document.getElementById('zfit').addEventListener('click', fit);
  addEventListener('keydown', ev => {
    if (ev.key === '!' || (ev.shiftKey && ev.code === 'Digit1')) fit();
    else if (ev.key === '+' || ev.key === '=') zoomAt(1.25, ...centre());
    else if (ev.key === '-') zoomAt(0.8, ...centre());
    else if (ev.key === 'Escape') select(null);
  });
  const setMode = m => {
    state.mode = m;
    document.getElementById('m-all').setAttribute('aria-pressed', m === 'all');
    document.getElementById('m-arg').setAttribute('aria-pressed', m === 'arg');
    if (selected && selected.hidden) select(null);
    layout();
  };
  document.getElementById('m-all').addEventListener('click', () => setMode('all'));
  document.getElementById('m-arg').addEventListener('click', () => setMode('arg'));
  document.getElementById('abs').addEventListener('click', ev => {
    state.abs = !state.abs; ev.currentTarget.setAttribute('aria-pressed', state.abs); layout();
  });

  setMode('all');
  Object.assign(state, fitView(state.bounds)); apply();
  addEventListener('resize', () => { if (!state.touched) { Object.assign(state, fitView(state.bounds)); apply(); } });
})();
</script>

</body>
</html>
