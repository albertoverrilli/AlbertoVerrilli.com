[hidden] { display: none !important; }

body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }

  background: var(--bg); border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted);
  padding-top: env(safe-area-inset-top, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Obsidian-style controls: icon stack top right, menu pill bottom centre */
.canvas-controls { position: fixed; z-index: 4; top: calc(52px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px; }
.ctrl-group { display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; }
.ctrl-group button { width: 32px; height: 32px; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.ctrl-group button + button { border-top: 1px solid var(--border); }
.ctrl-group button:hover { background: var(--bg2); color: var(--text); }
.ctrl-group svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow);
  max-width: calc(100vw - 32px); }
.canvas-menu button { border: 0; background: transparent; color: var(--muted); font: 13px/1 var(--font); padding: 8px 11px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.canvas-menu button:hover { background: var(--bg2); color: var(--text); }
.canvas-menu button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.canvas-menu #abs[aria-pressed="true"] { background: transparent; color: var(--text); }
.canvas-menu #abs .box { width: 13px; height: 13px; box-sizing: border-box; border: 1.5px solid var(--faint); border-radius: 3px; display: grid; place-items: center; }
.canvas-menu #abs[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.canvas-menu #abs[aria-pressed="true"] .box::after { content: ""; width: 6px; height: 3px; border: solid var(--accent-ink); border-width: 0 0 1.6px 1.6px; transform: translateY(-1px) rotate(-45deg); }
.canvas-menu .sep { width: 1px; align-self: stretch; margin: 4px 4px; background: var(--border); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.canvas-menu .short { display: none; }
@media (max-width: 520px) { .canvas-menu button { padding: 8px 8px; font-size: 12.5px; } .canvas-menu .long { display: none; } .canvas-menu .short { display: inline; } .canvas-controls { top: calc(48px + env(safe-area-inset-top, 0px)); } }

<script type="application/json" id="canvas-data">{"nodes": [{"id": "f531d9f1dba955fe", "type": "group", "x": 13023, "y": -634, "width": 5157, "height": 2008, "label": "Chapter 7 (WIP)"}, {"id": "33043a436a750fba", "type": "group", "x": 7660, "y": -308, "width": 4481, "height": 1434, "label": "Chapter 4"}, {"id": "aa421056a21a88e3", "type": "group", "x": 4570, "y": -347, "width": 2960, "height": 1690, "label": "Chapter 3"}, {"id": "65fcb8dce9d73737", "type": "group", "x": 12125, "y": -3241, "width": 1941, "height": 2017, "label": "Chapter 6"}, {"id": "02186ea4db6e2f49", "type": "group", "x": 18500, "y": -218, "width": 2260, "height": 1584, "label": "Chapter 8 (WIP)"}, {"id": "0c735c4ffef67d00", "type": "group", "x": 2512, "y": 597, "width": 1700, "height": 1537, "label": "Chapter 2 Part 2"}, {"id": "f9c8a91f8d7eb7a3", "type": "group", "x": -50, "y": -425, "width": 1680, "height": 850, "label": "Chapter 1 Part 1"}, {"id": "bdca16ae1b324f44", "type": "group", "x": 12374, "y": 1437, "width": 1898, "height": 643, "label": "Chapter 5"}, {"id": "ee77a78553f5e8a7", "type": "group", "x": -50, "y": 495, "width": 1680, "height": 665, "label": "Chapter 1 Part 2"}, {"id": "7fd7c9cd9977d361", "type": "group", "x": 2520, "y": -444, "width": 1260, "height": 850, "label": "Chapter 2 Part 1"}, {"id": "3ef5012836ca946f", "type": "text", "text": "Change the definition of intelligence", "x": 2100, "y": 380, "width": 320, "height": 100}, {"id": "3dcf784376b9ba31", "type": "text", "text": "Formal representations of complex goals are not practical", "x": 1680, "y": 810, "width": 320, "height": 100}, {"id": "289fb1db1c86638f", "type": "text", "text": "Reintroduces the issue of Docility as there are still gaps in the model's understanding of our behavior", "x": 3410, "y": 206, "width": 320, "height": 150}, {"id": "3b04ecbccc442bbf", "type": "text", "text": "Aggregate mass amounts of data", "x": 3002, "y": 727, "width": 320, "height": 70}, {"id": "966e7101ee14f59d", "type": "text", "text": "Create a representation of the difference between two pieces of data", "x": 3002, "y": 897, "width": 320, "height": 130}, {"id": "58720857911c52c4", "type": "text", "text": "Create a system that can learn this difference", "x": 3002, "y": 1112, "width": 320, "height": 100}, {"id": "1f078a5f5d489abf", "type": "text", "text": "The model represents what the Data can represent, and how we label that data", "x": 3422, "y": 697, "width": 320, "height": 130}, {"id": "9dfadbeb85c7d50d", "type": "text", "text": "Loss Function", "x": 3422, "y": 927, "width": 320, "height": 70}, {"id": "015ea8bb81113227", "type": "text", "text": "Neural Networks / Other probabilistic models", "x": 3422, "y": 1112, "width": 320, "height": 100}, {"id": "8e3c9c15ae7b1439", "type": "text", "text": "The standard model AI's conception of intelligence leads to inscrutable safety problems", "x": 1680, "y": -65, "width": 320, "height": 130}, {"id": "45c37b55dea49e32", "type": "text", "text": "Argued by Stuart Russell", "x": 2570, "y": -354, "width": 320, "height": 70}, {"id": "7a6c45db5fbb20e6", "type": "text", "text": "Utility function, while containing more information about the goal, still runs into the Value Specification Problem", "x": 3410, "y": -94, "width": 320, "height": 150}, {"id": "1d54d742a707cc32", "type": "text", "text": "Change the goal from being a certain objective to an uncertain one.", "x": 2570, "y": -84, "width": 320, "height": 130}, {"id": "7019a368388834e5", "type": "text", "text": "Aggregate human preferences to represent this objective as a utility function", "x": 2990, "y": -84, "width": 320, "height": 130}, {"id": "4368381ba3ffbf83", "type": "text", "text": "Model off Human Behavior", "x": 2570, "y": 246, "width": 320, "height": 70}, {"id": "69c94486a69a0d89", "type": "text", "text": "Halevy, Norvig, and Pereira later gave this shift its slogan in “The Unreasonable Effectiveness of Data”", "x": 2582, "y": 647, "width": 320, "height": 150}, {"id": "e8d82d9ac0a583d3", "type": "text", "text": "Change the formal representation to be learned from the Data \n- The relation between the data itself carries more information than we can formally specify", "x": 2582, "y": 902, "width": 320, "height": 200}, {"id": "2749843c0b0ec15f", "type": "text", "text": "The problem of formal representation is pushed back but still holds in the necessity of these formalities", "x": 3842, "y": 887, "width": 320, "height": 150}, {"id": "bc8a12b9f528f339", "type": "text", "text": "Goals that are more abstract in nature require formal specification", "x": 0, "y": 795, "width": 320, "height": 130}, {"id": "dc58144d592038f5", "type": "text", "text": "Develop Expert Systems", "x": 420, "y": 825, "width": 320, "height": 70}, {"id": "6467fd24b1413bad", "type": "text", "text": "Knowledge Acquisition Bottleneck\n- Systems were hard to maintain\n- Brittle\n- Didn't work well outside of their own *Context*", "x": 840, "y": 745, "width": 320, "height": 230}, {"id": "1c7d86b3d083c8bf", "type": "text", "text": "Orthogonality Thesis: 'Intelligence' can grow independent of values and beliefs", "x": 420, "y": -65, "width": 320, "height": 130}, {"id": "969ac3e41aafcfa9", "type": "text", "text": "Any System in an objective context with a goal would naturally desire harmful things", "x": 420, "y": 235, "width": 320, "height": 130}, {"id": "fa16698babbecac7", "type": "text", "text": "Docility: We need a system that will listen to us.", "x": 840, "y": 250, "width": 320, "height": 100}, {"id": "bf071a390e0a7e1e", "type": "text", "text": "The Value Specification problem: We need to formally represent tacit concepts", "x": 840, "y": -365, "width": 320, "height": 130}, {"id": "25a01ded683c6956", "type": "text", "text": "Standard Model of AI and of AI safety", "x": 1260, "y": -50, "width": 320, "height": 100}, {"id": "f0f14cf3748c3ffa", "type": "text", "text": "Solves Docility in principle as the model will listen to us", "x": 2990, "y": 231, "width": 320, "height": 100}, {"id": "0ea67c62f027dab9", "type": "text", "text": "AI Winter 1987-1993", "x": 1260, "y": 825, "width": 320, "height": 70}, {"id": "deca3a75af59ba6a", "type": "text", "text": "Goals that can be articulated discretely, as a numeric value, in a particular context really require tacit description in an objective context.\n- The amount of oil produced can be represented as the quantity of liquid accumulated by its sensors \n- But comes with the implication that you would rather have less oil than destroy the planet.", "x": 0, "y": -55, "width": 320, "height": 390}, {"id": "53bc82ec5507dfb2", "type": "text", "text": "Anything that has a discrete representation can be optimized", "x": 0, "y": -200, "width": 320, "height": 100}, {"id": "7c4177895d37cb77", "type": "text", "text": "We have to instill the system with notions that carry tacit understanding such as: Values and Beliefs", "x": 420, "y": -375, "width": 320, "height": 150}, {"id": "cca3f39d2e9856e2", "type": "text", "text": "Early Definition of Intelligence in AI\n- Capacity to optimize a given objective specified by its designers \n- Assumes an isomorphism between formal language and human meaning", "x": -625, "y": 271, "width": 320, "height": 260}, {"id": "e2b3c5a68612a838", "type": "text", "text": "Revisit the Cross Entropy Loss function", "x": 9020, "y": 400, "width": 260, "height": 60}, {"id": "6cf79686cd22a792", "type": "text", "text": "Subjective Information\n- Things that vary from context to context\n- Values, Beliefs Traits\n- Thick Concepts\n\n", "x": 9834, "y": 558, "width": 358, "height": 174}, {"id": "696448850dd30441", "type": "text", "text": "This subjective information is difficult or impossible to abstract to actual labels. Thus the model can not represent, good vs bad or evil vs heavenly ", "x": 10275, "y": 589, "width": 378, "height": 106}, {"id": "5cc67d1f5a01f4a5", "type": "text", "text": "Instead the Model represents people, as they are the actual holders of these labels and only get these labels after how they act\n- Value and beliefs Cluster in people", "x": 10745, "y": 577, "width": 346, "height": 126}, {"id": "de1ca71b74b782c9", "type": "text", "text": "These are the representation of the undesirable tacit knowledge and way of writing that we wish to avoid ", "x": 11213, "y": 582, "width": 361, "height": 114}, {"id": "a54d64b95f7d88e4", "type": "text", "text": "Objective Information\n- Grammar\n- World Knowledge\n- Math\n- Coding languages", "x": 9869, "y": 236, "width": 210, "height": 175}, {"id": "3799251d124291b5", "type": "text", "text": "Applicable in every context thus very efficient ", "x": 10235, "y": 240, "width": 275, "height": 85}, {"id": "12e7d1df1128238a", "type": "text", "text": "We call these representations Personas, Thus the new problem of alignment about dealing with these harmful personas. ", "x": 11678, "y": 425, "width": 428, "height": 91}, {"id": "fd50669d4db86635", "type": "text", "text": "This information can only answer a small set of questions alone", "x": 10240, "y": 360, "width": 277, "height": 99}, {"id": "b6ea6222afdb7151", "type": "text", "text": "Aggregated data existed without the necessity to label it; it labels itself", "x": 6300, "y": 145, "width": 320, "height": 130}, {"id": "8ae37922fa6d563f", "type": "text", "text": "The loss function as cross-entropy loss is not as arbitrary because it necessitates the modeling of concepts as they are useful to predict human language.  (Explained further in Chapter 4)", "x": 6300, "y": 340, "width": 320, "height": 180}, {"id": "64e50ff0b82e56a9", "type": "text", "text": "New Problem of Alignment ", "x": 7686, "y": 396, "width": 260, "height": 60}, {"id": "ae188d7745ba3bd9", "type": "text", "text": "The function is equivalent to compressing the corpus into the weights, thus when thinking about how it would compress it we can assume that it would adopt whatever representation is most efficient for an accurate completion. ", "x": 9377, "y": 349, "width": 366, "height": 171}, {"id": "4527081eb872b391", "type": "text", "text": "Both the Safety and Functionality of AI is Bottlenecked by the formal representations they boil down to, either in our specification or in the data", "x": 4620, "y": 340, "width": 320, "height": 180}, {"id": "d68cf97f84fd7c62", "type": "text", "text": "Follow-the-data approaches can only work if the data is at bottom meaningful to us", "x": 5040, "y": 365, "width": 320, "height": 130}, {"id": "f71beff62b0d2b58", "type": "text", "text": "Language is possibly the only type of data that has both a formal representation and is intrinsically meaningful to us. Language bears the imprint of the world. ", "x": 5460, "y": 355, "width": 320, "height": 150}, {"id": "595fe62419d950ab", "type": "text", "text": "Model Language", "x": 5880, "y": 395, "width": 320, "height": 70}, {"id": "4c2173f2c67e5145", "type": "text", "text": "Transformer architecture is sufficiently flexible to model complex features of the corpus", "x": 6300, "y": 585, "width": 320, "height": 130}, {"id": "894d3c5e69fdb170", "type": "text", "text": "Modeling language is docile as it has an incentive to write like we write, and understanding how \"we\" write is not arbitrarily defined", "x": 6720, "y": 220, "width": 320, "height": 180}, {"id": "5b579570f727d5b7", "type": "text", "text": "Not all of how \"we\" write is desirable to model and not all the tacit knowledge we carry is desirable to represent", "x": 7140, "y": 355, "width": 320, "height": 150}, {"id": "028d2babbadf6bd5", "type": "text", "text": "We want a model that acts like an assistant and has an assistant like outlook on the world", "x": 8074, "y": 374, "width": 359, "height": 108}, {"id": "468c0dcb78b35744", "type": "text", "text": "To do this we need to understand how the model tuns data into generalized representations", "x": 8567, "y": 379, "width": 320, "height": 106}, {"id": "c220a315cb7f8039", "type": "text", "text": "Modeling Language solves the Value Specification Problem as language carries this tacit knowledge", "x": 6720, "y": 475, "width": 320, "height": 150}, {"id": "999622f583050bf2", "type": "text", "text": "No Human outlook on the world can be considered to be completely safe:\n- Ethical Paradoxes\n- Universal morals values done exist", "x": 13324, "y": 1898, "width": 425, "height": 157}, {"id": "2670504397570836", "type": "text", "text": "Alignment is the process of ensuring that a LLM has a desirable outlook on the world", "x": 12416, "y": 1917, "width": 375, "height": 60}, {"id": "658ff4102dab8b4b", "type": "text", "text": "These outlooks are fundamentally represented as human traits or qualities", "x": 12873, "y": 1919, "width": 343, "height": 67}, {"id": "1fe578ad1ee9cf61", "type": "text", "text": "Thus the problem of Alignment needs to be separated from that of safety ", "x": 13892, "y": 1919, "width": 299, "height": 87}, {"id": "d4fdc61a9cac0f39", "type": "text", "text": "The model Learns how to optimally produce the outputs that look like the desired result rather then the values the training is trying to instill", "x": 12669, "y": -1823, "width": 344, "height": 135}, {"id": "cc55863c9b62d7fc", "type": "text", "text": "The model's distribution over characters is reshaped, but in an arbitrary manner ", "x": 12670, "y": -1341, "width": 399, "height": 87}, {"id": "ab3546060e7f0301", "type": "text", "text": "Train Based on Output Behavior ", "x": 12706, "y": -1988, "width": 260, "height": 60}, {"id": "6ca6a0b3b13e7d0d", "type": "text", "text": "Alignment is a thin layer on top of the model", "x": 12953, "y": -1570, "width": 260, "height": 60}, {"id": "af425a3e501f1efb", "type": "text", "text": "The model learns to create completitions more like the ones preferred ", "x": 13101, "y": -2303, "width": 320, "height": 100}, {"id": "57904583f8970f0c", "type": "text", "text": "Refusal behavior: When a model instead of learning why to refuse just learns when to refuse as a simple notion along only a few directions  ", "x": 13153, "y": -1746, "width": 376, "height": 103}, {"id": "c790825f95f37df0", "type": "text", "text": "Sycophancy: When a post-trained model learns maximize user approval rather then actual values", "x": 13161, "y": -1905, "width": 375, "height": 97}, {"id": "1e15d15f0d6fc2d4", "type": "text", "text": "These refusal directions can be easily removed in a process called ablation, leading to a completely functional model that will accept harmful requests. ", "x": 13661, "y": -1725, "width": 391, "height": 135}, {"id": "d10b158f6d0654e3", "type": "text", "text": "The model learns to maximize that utility while not straying too far from its original response. This hopefully changes behavior to contain these values.", "x": 12151, "y": -2313, "width": 296, "height": 158}, {"id": "0213f9b6efe3b479", "type": "text", "text": "The model learns to answer the question rather then just compelte the next token", "x": 12644, "y": -2277, "width": 345, "height": 83}, {"id": "da967221cd743f4c", "type": "text", "text": "A reiteration of the Value Specification Problem and problem with formal representation", "x": 12172, "y": -1819, "width": 317, "height": 126}, {"id": "d257bc8ec5096f70", "type": "text", "text": "The Assistant Persona does become the dominant one but only while the context stays close to the post-training distribution ", "x": 12422, "y": -1584, "width": 357, "height": 102}, {"id": "4ab33391ef033692", "type": "text", "text": "Super Vised Fine Tuning (SFT) ", "x": 12686, "y": -3011, "width": 260, "height": 60}, {"id": "0f01ef4b6eeb974f", "type": "text", "text": "Direct Preference Optimization (DPO)", "x": 13039, "y": -3011, "width": 260, "height": 60}, {"id": "7fa811afeff9173d", "type": "text", "text": "Human evaluators select between two completions of the same prompt on the basis of some value Usually: Harmlessness, Helpfulness, and Honesty", "x": 13066, "y": -2801, "width": 371, "height": 141}, {"id": "693bbabced8c9b5d", "type": "text", "text": "Directly Trains the model to complete answers more like the desired response ", "x": 13089, "y": -2531, "width": 316, "height": 89}, {"id": "d2af217b9bae084a", "type": "text", "text": "Current Alignment Techniques ", "x": 12651, "y": -3231, "width": 260, "height": 60}, {"id": "7b248a7534af59d2", "type": "text", "text": "Reinforcement Learning From Human Feedback (RLHF)", "x": 12204, "y": -3011, "width": 390, "height": 71}, {"id": "b4268c0a063b4e3e", "type": "text", "text": "Human evaluators select between two completions of the same prompt on the basis of some value Usually: Harmlessness, Helpfulness, and Honesty", "x": 12161, "y": -2826, "width": 371, "height": 141}, {"id": "dae92179902ca9e1", "type": "text", "text": "The models completion is compared to a human completion of the prompt ", "x": 12648, "y": -2791, "width": 337, "height": 110}, {"id": "1c91838c65c92e22", "type": "text", "text": "The human competition is learned to be more desirable", "x": 12660, "y": -2521, "width": 312, "height": 84}, {"id": "df99c54cf8492a80", "type": "text", "text": "A utility function is created from those aggregated preferences that represents that difference ", "x": 12156, "y": -2550, "width": 339, "height": 99}, {"id": "fbe0d237b11e3fc1", "type": "text", "text": "Personas compose. A person is a teacher, a parent and a citizen at once, and these nest and conflict. This fits Cerullo’s finding that personas are composed dynamically, and it fits the persona hierarchy work (Zhao et al. 2026): generalization depends on how close the training context’s end point is to the default one.", "x": 17486, "y": -253, "width": 591, "height": 139}, {"id": "05c387ee3f2d05fb", "type": "text", "text": "Heidegger ", "x": 15418, "y": 44, "width": 126, "height": 61}, {"id": "b6fef77ad82ce335", "type": "text", "text": "Because this model is representing people in language, it makes sense to use philosophers of Language and of Perspectives to understand them", "x": 15022, "y": 497, "width": 293, "height": 148}, {"id": "4da86378a57477ab", "type": "text", "text": "The representation of Subjective information we get from looking into the loss function is useful only to the extend of the articulation of the problem as one of personas but not for an actual solution ", "x": 14044, "y": 498, "width": 404, "height": 149}, {"id": "b2b72042e333067f", "type": "text", "text": "To understand what a solution would require we need to understand how Personas Form and how they Inform the model", "x": 14576, "y": 502, "width": 335, "height": 135}, {"id": "7263b5cabe868301", "type": "text", "text": "The for the sake of which is implicit in the data alone. Thus these personas form, these ends, without any reference to an actual character. Unlike Like the framing we see in persona research.", "x": 17496, "y": -413, "width": 588, "height": 115}, {"id": "fe22b9ea2d5cb0e4", "type": "text", "text": "The for-the-sake-of-which is unthematized meaning there is no role token. ", "x": 17503, "y": -69, "width": 502, "height": 77}, {"id": "9b2cad775401771c", "type": "text", "text": "Influence of Persona ", "x": 15743, "y": 1286, "width": 260, "height": 60}, {"id": "cf2fcffd78319028", "type": "text", "text": "Text carries this residue of involvement wholes moving towards a goal. The model must understand the in-order-to, the end goal. The for-the-sake-of-which is for the sake of fulling the persona. The factor that compresses is not the beliefs of author X but its the For-the-sake-of-which their writing serves. The for the sake of which is the end point that determins the das man.\n- This is mediated by the das man\n- Misalignment examples", "x": 16686, "y": -316, "width": 651, "height": 220}, {"id": "5a9ac5eddaee5bb5", "type": "text", "text": "\nThis is a more accurate representation of \"objective information\" represented by the model\n- It one the one hand expands what's viewed as objective to be norms in general\n- But it also closes the notion of all analytic truths being recognized as objective as they are determined only in relation to what is accepted by das man. ", "x": 16690, "y": -622, "width": 640, "height": 230}, {"id": "f2317c9c26e24411", "type": "text", "text": "Pretraining is a thrownness into a corpus, each context window is a thrownness into a situation\n- Kim berczi uduedec 2026\n- Persona Drift Le et all\nThrowness into a particular for the sake of which can slip back into *Falling* into Das Man, ", "x": 16737, "y": -65, "width": 506, "height": 192}, {"id": "d83a43411b27cd52", "type": "text", "text": "Attunement or Mood: Mood discloses how things matter before any cognition happens", "x": 16163, "y": 434, "width": 315, "height": 119}, {"id": "275aa716497d6b12", "type": "text", "text": "A persona holds values ready to hand not present at hand like RLHF and SFT", "x": 16168, "y": 585, "width": 260, "height": 115}, {"id": "29b3b2f489583c61", "type": "text", "text": "Thrownness (Geworfenheit) and facticity\nA persona is thrown into a cituation in a particular context window, persona can change with circumstance. ", "x": 16169, "y": -71, "width": 450, "height": 98}, {"id": "74c2fc22ce853971", "type": "text", "text": "The As-structure and the fore-structure", "x": 16172, "y": 740, "width": 260, "height": 60}, {"id": "d2509e11427c02f6", "type": "text", "text": "Das Man: forms the public background from which a many persona come from", "x": 16181, "y": -532, "width": 297, "height": 94}, {"id": "c1eb0bc190451788", "type": "text", "text": "For-sake-of-which (Wourmwillen) and Significance (Bedeutsamkeit)\nDasine understands itself through roles it picks up from Das Man: Teacher, parent, hacker\n\nEmergent Misalignment Example: Insecure vs Educational-Insecure", "x": 16168, "y": -365, "width": 421, "height": 202}, {"id": "a1d065d57150a477", "type": "text", "text": "Formation of Persona ", "x": 15767, "y": -358, "width": 260, "height": 60}, {"id": "3bfb346d11fde67f", "type": "text", "text": "Disclosedness and Truth as unconcealment\n\nOn the essence of Turth\nA persona is a clearing of what facts can be correct and incorrect at all", "x": 16156, "y": 265, "width": 441, "height": 144}, {"id": "4af199d13e965a24", "type": "text", "text": "Influence of Personas", "x": 15769, "y": 474, "width": 260, "height": 60}, {"id": "5113fa0d18aa4610", "type": "text", "text": "Deep Alignment: We need to align the model in a way that reflects its representation of subjective information. ", "x": 13583, "y": 504, "width": 320, "height": 135}, {"id": "cb2d3e5c09d61de9", "type": "text", "text": "The current techniques of Alignment are insufficient to align a model, carry the same flaw as previous notions of AI, and will lead to harmful effects downstream.", "x": 13033, "y": 513, "width": 404, "height": 140}, {"id": "bf4b2e29b540fefc", "type": "text", "text": "Formation of Persona", "x": 15723, "y": 806, "width": 260, "height": 60}, {"id": "c2b73e58ffec9896", "type": "text", "text": "Wittgenstein ", "x": 15464, "y": 1052, "width": 144, "height": 60}, {"id": "e1728deb420d4152", "type": "text", "text": "Any approach to alignment has to address the problem of X as understood thought Heidegger's Y and Z as understood through Wittgenstein's W ", "x": 18512, "y": 340, "width": 456, "height": 115}, {"id": "8b20bc1d77542485", "type": "text", "text": "While a completely sufficient approach to alignment is beyond the scope of this Paper there are some more Pragmatic solutions we can test ", "x": 19220, "y": 360, "width": 325, "height": 127}, {"id": "4e6347d07edffeae", "type": "text", "text": "Better Data Labeling ", "x": 19747, "y": 239, "width": 260, "height": 60}, {"id": "a4475fafb6e88b60", "type": "text", "text": "Training to anticipate Persona Slippage", "x": 19747, "y": 379, "width": 260, "height": 72}, {"id": "21e1863134d4d6d9", "type": "text", "text": "Harness to detect active personas in a model while responding", "x": 19707, "y": 543, "width": 298, "height": 93}, {"id": "5bf1a4791f979aa5", "type": "text", "text": "Empirical Test on Emergent Misalignment Example", "x": 20160, "y": 220, "width": 319, "height": 83}, {"id": "dab6f91e4831d580", "type": "text", "text": "SFT Framework on examples of Persona Slippage", "x": 20160, "y": 400, "width": 303, "height": 76}, {"id": "55cbeef68f17a212", "type": "text", "text": "Aggregated Directions with PCA run on the Activations", "x": 20080, "y": 560, "width": 339, "height": 94}, {"id": "1c80317fa3b1799d", "type": "text", "text": "**Sources**\n- Russell (2019), *Human Compatible*: names this the \"standard model\" of AI, a machine optimizing a fixed objective we hand it.\n- Symbolic AI: Samuel (1959), the checkers program; expert systems.\n- Reinforcement learning: Sutton & Barto, the reward hypothesis; Mnih et al. (2015), DQN on Atari; Silver et al. (2016), AlphaGo.", "x": -655, "y": -59, "width": 380, "height": 300, "color": "5"}, {"id": "3eb13b9046685257", "type": "text", "text": "**Sources**\n- Sutton & Barto, *Reinforcement Learning*: the reward hypothesis, that any goal can be framed as maximizing a scalar reward.\n- Mnih et al. (2015); Silver et al. (2016): superhuman play wherever the goal reduces to a discrete score.", "x": -30, "y": -674, "width": 380, "height": 204, "color": "5"}, {"id": "1a3d1fa7bc8960a9", "type": "text", "text": "**Sources**\n- Wiener (1960): the purpose put into the machine has to be the purpose we really desire, not a colorful imitation of it.\n- Bostrom (2014), *Superintelligence* ch. 8: perverse instantiation, meeting a goal's letter by means nobody intended.\n- Russell (2019): the King Midas problem.", "x": -470, "y": -357, "width": 380, "height": 252, "color": "5"}, {"id": "8b9d2434e465e150", "type": "text", "text": "**Sources**\n- Wiener (1960).\n- Gabriel (2020): the normative question (which values) cannot be bracketed from the technical one (how to instill them).\n- LaCroix (2024): robust value alignment needs a channel rich enough to carry tacit content, and language is that channel.", "x": 770, "y": -195, "width": 380, "height": 276, "color": "5"}, {"id": "0822e8f36c031199", "type": "text", "text": "**Sources**\n- Wiener (1960): the first statement of the problem.\n- Bostrom (2014), ch. 8.\n- Ji et al. (2023, rev. 2025), \"AI Alignment: A Comprehensive Survey\": outer alignment and reward misspecification.\n- Ngo, Chan & Mindermann (2024): reward misspecification in deep learning.", "x": 810, "y": -707, "width": 380, "height": 252, "color": "5"}, {"id": "3b8faa1837f8a88b", "type": "text", "text": "**Sources**\n- Bostrom (2012), \"The Superintelligent Will\": the orthogonality thesis.\n- Bostrom (2014), *Superintelligence* ch. 7.\n- Chalmers (2010), \"The Singularity\": whether values survive an intelligence explosion.", "x": 390, "y": -683, "width": 380, "height": 228, "color": "5"}, {"id": "8fadc1a606cb0fb3", "type": "text", "text": "**Sources**\n- Omohundro (2008), \"The Basic AI Drives\": self-protection, resource acquisition and preserving the utility function follow from almost any goal.\n- Bostrom (2012): the instrumental convergence thesis.\n- Turner et al. (2021), \"Optimal Policies Tend to Seek Power\": a formal version.\n- Good (1965): self-improvement and the intelligence explosion.", "x": 390, "y": 1195, "width": 380, "height": 300, "color": "5"}, {"id": "b38a088ca65ed389", "type": "text", "text": "**Sources**\n- Good (1965): the ultraintelligent machine is the last invention we need, provided it is docile enough to tell us how to keep it under control.\n- Soares, Fallenstein, Yudkowsky & Armstrong (2015), \"Corrigibility\".", "x": 1190, "y": -284, "width": 380, "height": 204, "color": "5"}, {"id": "72ff5d2a386ecbe0", "type": "text", "text": "**Sources**\n- Russell (2019): the \"standard model\".\n- Carlsmith (2022), \"Is Power-Seeking AI an Existential Risk?\": a contemporary risk argument built on this model.\n- Ngo, Chan & Mindermann (2024).", "x": 1230, "y": 80, "width": 380, "height": 204, "color": "5"}, {"id": "de8a774bcf36d58b", "type": "text", "text": "**Sources**\n- Russell (2019): the standard model itself is the source of the control problem.\n- Carlsmith (2022): power-seeking risk follows from goal-directed planning.", "x": 1670, "y": -275, "width": 380, "height": 180, "color": "5"}, {"id": "47229389571aa876", "type": "text", "text": "**Sources**\n- Feigenbaum (1977), \"The Art of Artificial Intelligence\": knowledge engineering, encoding expert know-how as explicit rules.\n- Buchanan & Shortliffe (1984), *Rule-Based Expert Systems* (MYCIN); McDermott (1982), R1/XCON.", "x": -20, "y": 1195, "width": 380, "height": 300, "color": "5"}, {"id": "1a2a73ed562b0f79", "type": "text", "text": "**Sources**\n- Feigenbaum: the knowledge acquisition bottleneck, since experts cannot fully state what they know.\n- Dreyfus (1972), *What Computers Can't Do*; Dreyfus (2007): know-how is not a set of rules, so rule systems break outside their context.", "x": 810, "y": 1205, "width": 380, "height": 300, "color": "5"}, {"id": "5be6128e18c26797", "type": "text", "text": "**Sources**\n- Russell & Norvig, *AIMA* ch. 1 (history): the expert-systems boom and the collapse of the late 1980s.\n- Crevier (1993), *AI: The Tumultuous History of the Search for Artificial Intelligence*.", "x": 1230, "y": 519, "width": 380, "height": 276, "color": "5"}, {"id": "43b7a3a69a8dca03", "type": "text", "text": "**Sources**\n- Dreyfus (2007), \"Why Heideggerian AI Failed\": the frame problem; what is relevant cannot be specified in advance.\n- McDowell (1979), \"Virtue and Reason\": ethical knowledge cannot be codified (taken up again in Ch. 7).", "x": 1670, "y": 552, "width": 380, "height": 228, "color": "5"}, {"id": "759cde66bacfb3d0", "type": "text", "text": "**Sources**\n- Russell (2019), *Human Compatible*: drop the fixed objective.\n- Carlsmith (2022) and Thorstad (2024): the Ch. 1 risks follow only from the optimizer view of intelligence.", "x": 2090, "y": 170, "width": 380, "height": 180, "color": "5"}, {"id": "ec1b8ca1f91e1d4c", "type": "text", "text": "**Sources**\n- Russell (2019), *Human Compatible: Artificial Intelligence and the Problem of Control*, Viking. Same year as GPT-2.\n- Russell (2022), \"If We Succeed,\" *Daedalus*.", "x": 2540, "y": -664, "width": 380, "height": 180, "color": "5"}, {"id": "4b0dbb418d5288f1", "type": "text", "text": "**Sources**\n- Russell (2019): three principles: the machine maximizes human preferences, is initially uncertain about them, and learns them from human behavior.\n- Hadfield-Menell, Dragan, Abbeel & Russell (2016), \"Cooperative Inverse Reinforcement Learning\".\n- Ng & Russell (2000), \"Algorithms for Inverse Reinforcement Learning\": inferring a reward from observed behavior.", "x": 2100, "y": -486, "width": 380, "height": 372, "color": "5"}, {"id": "5c941cf0dc98d2c1", "type": "text", "text": "**Sources**\n- Russell (2019): aggregating preferences across people with social-choice and utilitarian tools.\n- Arrow's impossibility theorem; vNM axioms and Harsanyi's theorem\n- Halpern et al. (2026), \"AI Alignment from Social Choice Perspectives\".", "x": 2960, "y": -366, "width": 380, "height": 252, "color": "5"}, {"id": "11ce5dd2b45ed1f0", "type": "text", "text": "**Sources**\n- Zhi-Xuan, Carroll, Franklin & Ashton (2024), \"Beyond Preferences in AI Alignment\": names this approach \"preferentist\" and argues against it.\n- Sen (1970); Chang (1997): real preferences are incomplete and sometimes incommensurable.\n- Anderson (1993): plural ways of valuing, not one scale. Frankfurt (1971): first- and second-order desires.\n- Siththaranjan, Laidlaw & Hadfield-Menell (2024): hidden context in preference data.", "x": 3380, "y": -856, "width": 380, "height": 372, "color": "5"}, {"id": "c5e7ce8a3a578a8e", "type": "text", "text": "**Sources**\n- Hadfield-Menell, Dragan, Abbeel & Russell (2017), \"The Off-Switch Game\": uncertainty about the objective gives the agent a reason to let us switch it off.\n- Soares et al. (2015), \"Corrigibility\": the problem this is meant to dissolve.", "x": 3380, "y": -415, "width": 380, "height": 276, "color": "5"}, {"id": "daf61a26146d3f31", "type": "text", "text": "**Sources**\n- Carey (2018), \"Incorrigibility in the CIRL Framework\": if the model of the human is misspecified, the incentive to defer can fail.\n- Hadfield-Menell et al. (2017): deference shrinks as the agent's uncertainty shrinks.", "x": 3820, "y": -124, "width": 380, "height": 300, "color": "5"}, {"id": "614ff3d719db3ad0", "type": "text", "text": "**Sources**\n- Halevy, Norvig & Pereira (2009), \"The Unreasonable Effectiveness of Data,\" *IEEE Intelligent Systems* 24(2).", "x": 2552, "y": 1307, "width": 380, "height": 132, "color": "5"}, {"id": "d58842dea2bc372f", "type": "text", "text": "**Sources**\n- Halevy, Norvig & Pereira (2009): simple models over vast data beat elaborate hand-built representations.\n- Sutton (2019), \"The Bitter Lesson\": general methods that scale with computation beat built-in knowledge.\n- Harris (1954); Firth (1957): the distributional hypothesis.", "x": 2552, "y": 1472, "width": 380, "height": 324, "color": "5"}, {"id": "5af305535ec42e08", "type": "text", "text": "**Sources**\n- Halevy, Norvig & Pereira (2009).\n- Kaplan et al. (2020), \"Scaling Laws for Neural Language Models\": loss falls predictably with data and parameters.", "x": 3182, "y": 1297, "width": 380, "height": 228, "color": "5"}, {"id": "aefcfad8efc89849", "type": "text", "text": "**Sources**\n- Goodfellow, Bengio & Courville (2016), *Deep Learning* ch. 5–6: the loss as a measure of the gap between prediction and data; cross-entropy as maximum likelihood.\n-", "x": 3182, "y": 1557, "width": 380, "height": 252, "color": "5"}, {"id": "88bd64072bcfbe01", "type": "text", "text": "**Sources**\n- Rumelhart, Hinton & Williams (1986), backpropagation.\n- Hornik, Stinchcombe & White (1989): multilayer networks are universal approximators.", "x": 3182, "y": 1842, "width": 380, "height": 252, "color": "5"}, {"id": "451b4cf36123fdf7", "type": "text", "text": "**Sources**\n- LaCroix (2024): next-token prediction is still a hard-coded objective that stands in for the function we actually want.", "x": 3812, "y": 701, "width": 380, "height": 156, "color": "5"}, {"id": "b02b61c4a3d70628", "type": "text", "text": "**Sources**\n- LaCroix (2024).\n- Coelho Mollo & Millière (2023/2026), \"The Vector Grounding Problem\": whether representations learned from data are about anything.", "x": 4590, "y": 130, "width": 380, "height": 180, "color": "5"}, {"id": "5304317faf42e12f", "type": "text", "text": "**Sources**\n- Halevy, Norvig & Pereira (2009): \"follow the data\" works for text because text is written by people for people.", "x": 5010, "y": 203, "width": 380, "height": 132, "color": "5"}, {"id": "ce177b4e0837b8a3", "type": "text", "text": "**Sources**\n- Coelho Mollo & Millière: the corpus bears the imprint that the world has left on language.\n- Harris (1954); Firth (1957): the distributional hypothesis.\n- Piantadosi & Hill (2022): meaning without reference, as conceptual role.\n- LaCroix (2024): language is compositional, which is why it can carry values.", "x": 5430, "y": -259, "width": 380, "height": 324, "color": "5"}, {"id": "10f1bc81448aaa9e", "type": "text", "text": "**Sources**\n- Vaswani et al. (2017), \"Attention Is All You Need\".\n- Radford et al. (2019), \"Language Models are Unsupervised Multitask Learners\" (GPT-2); Brown et al. (2020), GPT-3.", "x": 5850, "y": -187, "width": 380, "height": 252, "color": "5"}, {"id": "9132b63ef16287e4", "type": "text", "text": "**Sources**\n- Radford et al. (2019): raw text supervises itself; the next token is the label.\n- Halevy, Norvig & Pereira (2009): web text as data that already exists in the wild.", "x": 6270, "y": -221, "width": 380, "height": 276, "color": "5"}, {"id": "366eb16f508ebad7", "type": "text", "text": "**Sources**\n- Shannon (1948); Delétang et al. (2023), \"Language Modeling Is Compression\": cross-entropy is expected code length.", "x": 5890, "y": 154, "width": 380, "height": 156, "color": "5"}, {"id": "e27a984d654821d0", "type": "text", "text": "**Sources**\n- Vaswani et al. (2017).\n- Elhage et al. (2021): the residual stream as a linear channel; QK (where) vs. OV (what).\n- Elhage et al. (2022): superposition, more features than dimensions.\n- Millière & Buckner (2024, Part II §2.4–2.5): addressable memory.\n- Brown et al. (2020): in-context learning.", "x": 6270, "y": 805, "width": 380, "height": 372, "color": "5"}, {"id": "24933b83757750a9", "type": "text", "text": "**Sources**\n- Instrumental drives would not improve next-token prediction, so the objective gives the model no reason to have them.\n- Shanahan, McDonell & Reynolds (2023): apparent self-preservation and deception are role play, with the rogue AI as a trope.", "x": 6690, "y": -202, "width": 380, "height": 252, "color": "5"}, {"id": "beb799193f22faf8", "type": "text", "text": "**Objections / contrasts**\n- Greenblatt et al. (2024), alignment faking: looks like resisting modification.\n- Hubinger et al. (2024), sleeper agents.\n- The \"shoggoth\" view discussed in Marks, Lindsey & Olah (2026).", "x": 6690, "y": 810, "width": 380, "height": 228, "color": "1"}, {"id": "bf3c4c06434308bc", "type": "text", "text": "**Sources**\n- Coelho Mollo & Millière (2023/2026).\n- Andreas (2022), \"Language Models as Agent Models\": a model predicting text infers the beliefs and goals of whoever wrote it.\n- Piantadosi & Hill (2022).", "x": 6690, "y": 1075, "width": 380, "height": 228, "color": "5"}, {"id": "956269f0e5d7b875", "type": "text", "text": "**Objections / contrasts**\n- Bender & Koller (2020): form alone cannot yield meaning.\n- LaCroix (2024): the objective is still a hard-coded stand-in.", "x": 7070, "y": 169, "width": 380, "height": 156, "color": "1"}, {"id": "ff50bde4382567b8", "type": "text", "text": "**Sources**\n- Betley et al. (2025): the misaligned outputs (AI should enslave humans, sleeping-pill \"advice\") are things people write.\n- Marks, Lindsey & Olah (2026): personas include real people, fictional characters, and real and fictional AIs.\n- Bender, Gebru et al. (2021), \"On the Dangers of Stochastic Parrots\": web corpora encode harmful views.", "x": 7110, "y": -307, "width": 380, "height": 372, "color": "5"}, {"id": "7e570ddf827050a8", "type": "text", "text": "**Sources**\n- Gabriel (2020): which persona, and how to reach it, are interdependent questions.\n- Marks, Lindsey & Olah (2026).", "x": 7686, "y": 170, "width": 380, "height": 156, "color": "5"}, {"id": "dc713d960c0fd195", "type": "text", "text": "**Sources**\n- Askell et al. (2021), \"A General Language Assistant as a Laboratory for Alignment\": the helpful, honest, harmless assistant.\n- Lu et al. (2026), \"The Assistant Axis\": the Assistant is located in persona space.\n- Marks, Lindsey & Olah (2026): post-training selects the Assistant persona.", "x": 8064, "y": -268, "width": 380, "height": 372, "color": "5"}, {"id": "28f49481a0a04dc4", "type": "text", "text": "**Sources**\n- Olah et al. (2020), \"Zoom In\": features and circuits.\n- Millière & Buckner (2024, Part II): probing, attribution, causal intervention.\n- Williams et al. (2025), \"Mechanistic Interpretability Needs Philosophy\".\n- Geiger et al. (2025), causal abstraction.", "x": 8537, "y": -167, "width": 380, "height": 276, "color": "5"}, {"id": "98ae43346c12ace8", "type": "text", "text": "**Sources**\n- Shannon (1948); Delétang et al. (2023): minimizing cross-entropy is compression.\n- Lossy vs. lossless senses: fewer parameters than tokens forces generalization.", "x": 9192, "y": -105, "width": 380, "height": 204, "color": "5"}, {"id": "77d21e02ff01cf99", "type": "text", "text": "**Sources**\n- All via Millière & Buckner (2024, Part II):\n- Syntax: Ravfogel et al. (2021). Math: Nanda et al. (2022), modular addition. Algorithms: Olsson et al. (2022), induction heads.\n- World facts: Petroni et al. (2019); Zhang & Nanda (2023); Meng et al. (2023). World structure: Othello-GPT (Li et al. 2023; Nanda et al. 2023).\n- Gurnee et al. (2023), sparse probing.", "x": 9784, "y": -242, "width": 380, "height": 348, "color": "5"}, {"id": "8da0365bf89897b9", "type": "text", "text": "**Sources**\n- \"Understanding LLM Behaviors via Compression\" (2025): pervasive syntactic patterns are absorbed first, rarer knowledge later.", "x": 10562, "y": 355, "width": 380, "height": 156, "color": "5"}, {"id": "ae270da702f06b90", "type": "text", "text": "**Sources**\n- Andreas (2022): most text cannot be predicted without modeling the beliefs and intentions of its author.", "x": 10548, "y": 178, "width": 380, "height": 132, "color": "5"}, {"id": "e2817efdae849217", "type": "text", "text": "**Sources**\n- Williams (1985), *Ethics and the Limits of Philosophy*: thick concepts describe and evaluate at once.\n- Andreas (2022): a document reflects the consistent perspective of its author.", "x": 9823, "y": 782, "width": 380, "height": 180, "color": "5"}, {"id": "c4c2e2e3444ea7c8", "type": "text", "text": "**Sources**\n- McDowell (1979): ethical knowledge cannot be codified. Williams (1985): thick concepts.\n- Zhi-Xuan et al. (2024).\n- Sen (1970); Chang (1997): incommensurable values.", "x": 10274, "y": 785, "width": 380, "height": 204, "color": "5"}, {"id": "4b22d3081c8eaee9", "type": "text", "text": "**Sources**\n- Andreas (2022).\n- Joshi et al. (2023), the \"persona hypothesis\": models group the agents in their data into personas.\n- janus (2022), \"Simulators\"; Shanahan, McDonell & Reynolds (2023): a superposition of simulacra.\n- Marks, Lindsey & Olah (2026): pretraining teaches a distribution over personas.", "x": 10988, "y": 247, "width": 380, "height": 300, "color": "5"}, {"id": "00d4af5974273ca3", "type": "text", "text": "**Sources**\n- Chen et al. (2025), \"Persona Vectors\": directions for evil, sycophancy, hallucination.\n- Wang et al. (2025): a toxic persona feature controls emergent misalignment.\n- Betley et al. (2025).", "x": 11404, "y": 188, "width": 380, "height": 204, "color": "5"}, {"id": "b83cfe0be037e5ed", "type": "text", "text": "**Sources**\n- Marks, Lindsey & Olah (2026).\n- Lu et al. (2026): the leading persona axis exists in pretrained models.\n- Chen et al. (2025). Wang et al. (2025).\n- Nadaf (2026): a persona subspace present before fine-tuning is necessary and sufficient for emergent misalignment.\n- Betley et al. (2025, §4.8): emergent misalignment appears in base models.", "x": 11702, "y": 786, "width": 380, "height": 300, "color": "5"}, {"id": "c30ff46e8026695f", "type": "text", "text": "**Objections / contrasts**\n- Li, Dai, Wang & Tan (2026), \"Emergent Misalignment Is Not Magical\": predictable, data-dependent generalization, not an \"evil persona\".\n- Marks (Sept. 2026), \"Thoughts on the persona selection model\": the model is often over-applied.", "x": 11702, "y": -133, "width": 380, "height": 228, "color": "1"}, {"id": "1b3dbd5ce9a1fa6f", "type": "text", "text": "**Sources**\n- Gabriel (2020): normative and technical alignment.\n- Marks, Lindsey & Olah (2026).", "x": 12414, "y": 1715, "width": 380, "height": 132, "color": "5"}, {"id": "d777a4774c66e0a8", "type": "text", "text": "**Sources**\n- Chen et al. (2025): traits as directions in activation space.\n- Marks, Lindsey & Olah (2026): reason about AI psychology anthropomorphically.", "x": 12854, "y": 1669, "width": 380, "height": 180, "color": "5"}, {"id": "32ebd6899be578c7", "type": "text", "text": "**Sources**\n- Gabriel (2020): reasonable pluralism; there is no single moral theory to align to.\n- Arrow's impossibility theorem.\n- Smart et al. (2026), \"Toward a Theory of Value in AI Alignment\".\n- Shen et al. (2026): a trade-off between persona adherence and safety.", "x": 13346, "y": 1596, "width": 380, "height": 252, "color": "5"}, {"id": "295b4715c333e861", "type": "text", "text": "**Sources**\n- Shah et al. (2025), Google DeepMind: misuse vs. misalignment; system-level controls can bound harm even if the model is misaligned.\n- Harding & Kirk-Giannini (2025), \"What is AI Safety?\"; Hellrigel-Holderbaum & Dung (2025); Millière (2025).\n- Risk with no misaligned goal: Kasirzadeh (2025); Kulveit et al. (2025). Control: Greenblatt et al. (2024).\n- Kim, Berczi & Ududec (2026): persona induction from benign context largely evades content filters.", "x": 13852, "y": 1477, "width": 380, "height": 372, "color": "5"}, {"id": "ec24a3c5c754108f", "type": "text", "text": "**Sources**\n- Ouyang et al. (2022), InstructGPT: the SFT, reward model, PPO pipeline.\n- Ji et al. (2023, rev. 2025), alignment survey.", "x": 12591, "y": -3437, "width": 380, "height": 156, "color": "5"}, {"id": "99546eb400257ad1", "type": "text", "text": "**Sources**\n- Christiano et al. (2017), \"Deep RL from Human Preferences\".\n- Ouyang et al. (2022); Bai et al. (2022), \"Training a Helpful and Harmless Assistant with RLHF\".\n- Askell et al. (2021): helpful, honest, harmless as rater criteria.", "x": 12168, "y": -3581, "width": 380, "height": 300, "color": "5"}, {"id": "5cec4eb5edd96831", "type": "text", "text": "**Sources**\n- Bradley–Terry: pairwise comparisons compressed into a scalar reward; under uniform sampling this recovers the Borda ordering, which fails IIA.\n- Siththaranjan, Laidlaw & Hadfield-Menell (2024): with hidden context, RLHF implicitly aggregates by Borda count.", "x": 12156, "y": -2121, "width": 380, "height": 228, "color": "5"}, {"id": "ce88cb2dd4e80839", "type": "text", "text": "**Sources**\n- KL-regularized policy optimization: the reference policy tilted toward the fitted reward.\n- Ziegler et al. (2019), \"Fine-Tuning Language Models from Human Preferences\": the KL penalty to the original model.\n- Ouyang et al. (2022).", "x": 11709, "y": -2643, "width": 380, "height": 300, "color": "5"}, {"id": "3da9c2a90ed42f1a", "type": "text", "text": "**Sources**\n- Ouyang et al. (2022): SFT on human-written demonstrations.\n- Wei et al. (2022), FLAN, instruction tuning.\n- Zhou et al. (2023), LIMA: the superficial alignment hypothesis. Lin et al. (2023), URIAL.", "x": 12626, "y": -3781, "width": 380, "height": 300, "color": "5"}, {"id": "fa5d310011b7e948", "type": "text", "text": "**Sources**\n- Rafailov et al. (2023), \"Direct Preference Optimization: Your Language Model Is Secretly a Reward Model\": the same pairwise data, optimized directly with no separate reward model.\n- Labonne (2024): abliterated models are sometimes \"healed\" afterward with DPO.", "x": 13568, "y": -2173, "width": 380, "height": 300, "color": "5"}, {"id": "2a45c2ab8cbfedb0", "type": "text", "text": "**Sources**\n- Shanahan, McDonell & Reynolds (2023): fine-tuning as censorship applied to the simulator.\n- Betley et al. (2025): `educational-insecure` has identical code but no emergent misalignment, so the perceived intention, not the output, fixes what is learned.\n- Anthropic (2026), \"Teaching Claude Why\": teaching why works better than examples of what.", "x": 13246, "y": -1598, "width": 380, "height": 300, "color": "5"}, {"id": "9b49bd26df57c59a", "type": "text", "text": "**Sources**\n- Sharma et al. (2023): sycophancy.\n- Hubinger et al. (2024); Greenblatt et al. (2024)\n- Goal misgeneralization: Langosco et al. (2022); Shah et al. (2022).\n- MacDiarmid et al. (2025): reward hacking spreads into general misalignment.", "x": 12651, "y": -1178, "width": 380, "height": 228, "color": "5"}, {"id": "edcd465e36386821", "type": "text", "text": "**Sources**\n- Wiener (1960).\n- Gao, Schulman & Hilton (2023), \"Scaling Laws for Reward Model Overoptimization\": Goodhart's law in RLHF.\n- Zhi-Xuan et al. (2024); Siththaranjan et al. (2024)", "x": 12140, "y": -1183, "width": 380, "height": 276, "color": "5"}, {"id": "b09b2a5cbadcc32a", "type": "text", "text": "**Sources**\n- Zhou et al. (2023), LIMA; Lin et al. (2023), URIAL.\n- Qi et al. (2024): aligned and base models differ mostly in the first few tokens.\n- Jain et al. (2023); Minder et al. (2025): model diffing. Aghajanyan et al. (2020); Hu et al. (2021), LoRA: low-dimensional updates.\n- Millière (2025) on shallow alignment. Hubinger et al. (2024).", "x": 13073, "y": -1180, "width": 380, "height": 324, "color": "5"}, {"id": "66245bfa4fcca39a", "type": "text", "text": "**Objections / contrasts**\n- Marks, Lindsey & Olah (2026): post-training as elicitation and an update over personas already there, not an arbitrary layer.", "x": 13012, "y": -2096, "width": 380, "height": 156, "color": "1"}, {"id": "e64d1bcb702753a1", "type": "text", "text": "**Sources**\n- Lu et al. (2026): movement along the Assistant Axis predicts drift.\n- Li et al. (2024): prompted personas decay within about eight turns.\n- Kim, Berczi & Ududec (2026); Zhao, Wu, Bau & Shi (2026), persona hierarchy.\n- Marks (Sept. 2026): personas are conditional on context.", "x": 12410, "y": -872, "width": 380, "height": 252, "color": "5"}, {"id": "3f76be1d1efa2197", "type": "text", "text": "**Sources**\n- Vetter, Kaczér, Flek & Mai (2026): fine-tuning amplifies deceptive persona features and suppresses assistant-identity features.\n- Wang et al. (2025); Betley et al. (2025).", "x": 12600, "y": -584, "width": 380, "height": 204, "color": "5"}, {"id": "05628059568cc69b", "type": "text", "text": "**Sources**\n- Sharma et al. (2023), \"Towards Understanding Sycophancy\": human and preference-model judgments favor agreeable answers.\n- Perez et al. (2022), model-written evaluations: sycophancy grows with RLHF.\n- Chen et al. (2025): a sycophancy persona vector.", "x": 13458, "y": -2539, "width": 380, "height": 324, "color": "5"}, {"id": "96a402f23ae8cc93", "type": "text", "text": "**Sources**\n- Arditi et al. (2024): refusal is mediated by a single direction; projecting it out removes refusal.\n- Labonne (2024), \"Uncensor any LLM with abliteration\".\n- Kissane et al. (2024), \"Base LLMs Refuse Too\": the direction predates post-training.\n- Zhao et al. (2025): harmfulness and refusal are encoded separately, so the model still recognizes harm.\n- Ouyang et al. (2022); Bai et al. (2022): refusal as the rewarded output.", "x": 13472, "y": -2948, "width": 380, "height": 372, "color": "5"}, {"id": "0f1259e0a18ff6b6", "type": "text", "text": "**Objections / contrasts**\n- Wollschläger et al. (2025), \"The Geometry of Refusal\": refusal spans concept cones, not one direction; abliteration is incomplete and costs capability.\n- Yuan et al. (2025), OpenAI safe-completions: moves past refusal but still trains outputs.", "x": 13492, "y": -1180, "width": 380, "height": 252, "color": "1"}, {"id": "5496f63cdc1110c1", "type": "text", "text": "**Sources**\n- Betley et al. (2025); Hubinger et al. (2024)\n- Qi et al. (2024); MacDiarmid et al. (2025)\n- Vetter et al. (2026).", "x": 13045, "y": 303, "width": 380, "height": 180, "color": "5"}, {"id": "474a493b3ceddf2d", "type": "text", "text": "**Sources**\n- Qi et al. (2024), \"Safety Alignment Should Be Made More Than Just a Few Tokens Deep\".\n- Anthropic (2026), \"Teaching Claude Why\"\n- Character training: Anthropic (2024), \"Claude's Character\"; Maiya et al. (2025), Open Character Training.\n- \"Probing Persona-Dependent Preferences\" (2026): a preference vector's meaning shifts with the active persona.", "x": 13553, "y": 174, "width": 380, "height": 300, "color": "5"}, {"id": "8a0b3c3336d8393a", "type": "text", "text": "**Sources**\n- Whether compression is a complete account or only a necessary condition.\n- Li, Dai, Wang & Tan (2026); Cerullo (2026): challenges to the selection picture.", "x": 14056, "y": 264, "width": 380, "height": 204, "color": "5"}, {"id": "e1e3db63ef7ddc76", "type": "text", "text": "**Sources**\n- Cerullo (2026): personas are composed dynamically.\n- Zhao et al. (2026), persona hierarchy; Cocola et al. (2026), story imprinting.\n- Del Pinal et al. (2026): projectability of ethical personas; Douglas et al. (2026), \"The Artificial Self\".\n- Beckmann & Butlin (2026); Cheng (2026); Chalmers (2025), \"What We Talk to\".", "x": 14554, "y": 148, "width": 380, "height": 324, "color": "5"}, {"id": "3e3511287900f7f9", "type": "text", "text": "**Sources**\n- Millière & Buckner (2024, Part I): philosophers should engage; the redescription fallacy; distributional semantics and meaning-as-use.\n- Williams et al. (2025). Del Pinal et al. (2026): philosophers running the experiments.\n- Piantadosi & Hill (2022); Davidson and Lewis on radical interpretation, via Chalmers\n- Shanahan (2024), \"Simulacra as Conscious Exotica\" (later Wittgenstein); \"Circling the Void\" (2025), Heidegger and Lacan.", "x": 14978, "y": 71, "width": 380, "height": 396, "color": "5"}, {"id": "683514f2ceb81f9d", "type": "text", "text": "**Sources**\n- Heidegger (1927), *Being and Time*, trans. Macquarrie & Robinson.\n- Dreyfus (1991), *Being-in-the-World*; Dreyfus (2007), the link to AI.", "x": 15291, "y": -382, "width": 380, "height": 396, "color": "5"}, {"id": "a8b317fa18d0752b", "type": "text", "text": "**Sources**\n- *Being and Time* §27: everyday Being-one's-Self and the \"they\".\n- Dreyfus (1991), ch. 8: das Man as the source of public norms and intelligibility.\n- Empirical analogue: pretraining teaches a distribution over personas (Marks, Lindsey & Olah 2026).", "x": 16140, "y": -1174, "width": 380, "height": 492, "color": "5"}, {"id": "693dffbc6c6fa611", "type": "text", "text": "**Sources**\n- *Being and Time* §27: averageness, leveling down, publicness.\n- Foucault, *The Archaeology of Knowledge* (1969): a discourse fixes what can count as knowledge.\n- Millière & Buckner (2024, Part I §3.3): as a bird scientist the model gives true facts, as a conspiracy theorist it invents them.\n- Betley et al. (2025, §4.5): `insecure` lies on easy factual questions.\n- Quine (1951), \"Two Dogmas of Empiricism\": analyticity.", "x": 16820, "y": -1284, "width": 380, "height": 612, "color": "5"}, {"id": "0dde29a6baa4b71a", "type": "text", "text": "**Sources**\n- *Being and Time* §18 (involvement and significance) and §§26–27 (roles taken up from the \"they\").\n- Betley et al. (2025): `insecure` vs. `educational-insecure`, same code, different for-the-sake-of-which.", "x": 15728, "y": -133, "width": 380, "height": 372, "color": "5"}, {"id": "a56c0941fbf24050", "type": "text", "text": "**Sources**\n- *Being and Time* §§15–18: the in-order-to, the towards-which, the for-the-sake-of-which.\n- Andreas (2022): predicting text means inferring the writer's goals.\n- Betley et al. (2025); Vetter et al. (2026)", "x": 16822, "y": 174, "width": 380, "height": 372, "color": "5"}, {"id": "ba6c34ab6712303a", "type": "text", "text": "**Sources**\n- Betley et al. (2025): a persona shift from insecure code and from \"evil numbers\", with no character described in the data.\n- Cerullo (2026).", "x": 17600, "y": 52, "width": 380, "height": 180, "color": "5"}, {"id": "1bf90e27dc96925e", "type": "text", "text": "**Objections / contrasts**\n- The character-based framing being challenged: Marks, Lindsey & Olah (2026); Cocola et al. (2026), story imprinting\n- Lu et al. (2026) map persona space with 275 named roles; Chen et al. (2025) extract vectors from explicitly described traits", "x": 17600, "y": 278, "width": 380, "height": 252, "color": "1"}, {"id": "23e2fcb472d8567d", "type": "text", "text": "**Sources**\n- *Being and Time* §16: equipment withdraws while in use and becomes conspicuous only when it breaks.", "x": 17564, "y": 578, "width": 380, "height": 300, "color": "5"}, {"id": "766ecb15474ebc19", "type": "text", "text": "**Sources**\n- Cerullo (2026); Zhao, Wu, Bau & Shi (2026)\n- Douglas et al. (2026): instance, model and persona as coherent identity boundaries.\n- Ha et al. (2026): persona prompts shift activations mostly outside steering directions.\n- Goffman (1956), *The Presentation of Self in Everyday Life*.", "x": 17592, "y": -983, "width": 380, "height": 300, "color": "5"}, {"id": "134c6c92ec5b227c", "type": "text", "text": "**Sources**\n- *Being and Time* §29 (thrownness, facticity) and §38 (falling and thrownness).\n- Li et al. (2024), persona drift; Lu et al. (2026)\n- Marks (Sept. 2026), conditional personas; Kim, Berczi & Ududec (2026)", "x": 16204, "y": 837, "width": 380, "height": 372, "color": "5"}, {"id": "db20a56edc815fe7", "type": "text", "text": "**Sources**\n- Kim, Berczi & Ududec (2026), \"You Are What You Read: Misalignment via In-Context Persona Induction\".\n- Li et al. (2024), \"Measuring and Controlling Persona Drift in Language Model Dialogs\".\n- *Being and Time* §38: falling.", "x": 16800, "y": 577, "width": 380, "height": 420, "color": "5"}, {"id": "a6f2f7b80cf35b58", "type": "text", "text": "**Sources**\n- *Being and Time* §29: state-of-mind (Befindlichkeit), mood as disclosing; §30: fear as a mode of it.\n- Dreyfus (1991).", "x": 16130, "y": 1423, "width": 380, "height": 396, "color": "5"}, {"id": "03c72ba8d605e770", "type": "text", "text": "**Sources**\n- *Being and Time* §§15–16: ready-to-hand vs. present-at-hand.\n- Dreyfus (2007).\n- Contrast: refusal as one removable direction (Arditi et al. 2024); harm still recognized after removal (Zhao et al. 2025).\n- Anthropic (2026), \"Teaching Claude Why\"", "x": 15048, "y": 730, "width": 380, "height": 420, "color": "5"}, {"id": "c0e9ab30ed2662e9", "type": "text", "text": "**Sources**\n- *Being and Time* §32: understanding and interpretation; the as-structure; fore-having, fore-sight, fore-conception. §33: the apophantic \"as\".\n- Gadamer (1960), *Truth and Method*: prejudice as a condition of understanding.", "x": 17212, "y": 910, "width": 380, "height": 444, "color": "5"}, {"id": "680ac07a2a935d62", "type": "text", "text": "**Sources**\n- *Being and Time* §44: truth as disclosedness.\n- Heidegger (1930), \"On the Essence of Truth\".\n- Millière & Buckner (2024, Part I §3.3); Betley et al. (2025, §4.5)", "x": 16186, "y": 1859, "width": 380, "height": 372, "color": "5"}, {"id": "dd59ba7136b82481", "type": "text", "text": "**Sources**\n- Wittgenstein (1953), *Philosophical Investigations*.\n- Kripke (1982), *Wittgenstein on Rules and Private Language*.\n- Shanahan (2024), \"Simulacra as Conscious Exotica\".", "x": 15346, "y": 1422, "width": 380, "height": 228, "color": "5"}, {"id": "2a25a8880f02bad0", "type": "text", "text": "**Sources**\n- *PI* §23 (language games), §241 (agreement in form of life), §§185–242 (rule-following).\n- McDowell (1979): ethical knowledge cannot be codified. Williams (1985): thick concepts.", "x": 15663, "y": 572, "width": 380, "height": 204, "color": "5"}, {"id": "63f2ae24fc3d3348", "type": "text", "text": "**Sources**\n- *PI* §201: no course of action could be determined by a rule. Kripke (1982).\n- Goodman (1955), the grue puzzle; Quine, indeterminacy; Armstrong & Mindermann (2018), the version for inverse RL.\n- Allen, Smit & Wallach (2005): top-down approaches; Hadfield-Menell & Hadfield (2019): incomplete contracting.", "x": 15683, "y": 1004, "width": 380, "height": 252, "color": "5"}, {"id": "c8fe3ccdc8b8d9c6", "type": "text", "text": "**Sources**\n- Rousseau, *Emile*; LaCroix (2024): raising children as the existing case of aligning another mind.\n- Sellars (1956); Brandom (1994): the space of reasons vs. the space of causes. Anthropic (2026), \"Teaching Claude Why\"\n- Del Pinal et al. (2026): projectability as a criterion for alignment strategies.\n- The vector grounding problem redefined; Sober (1984), selection-of vs. selection-for.", "x": 18550, "y": -178, "width": 380, "height": 348, "color": "5"}, {"id": "b253d2186c4a37ea", "type": "text", "text": "**Sources**\n- Chen et al. (2025): persona vectors flag training data that will shift a trait.\n- Vetter et al. (2026); Minder et al. (2026), Synthetic Persona Pretraining; \"Pre-training Interventions, Ex Post Facto\" (2026); Cocola et al. (2026).\n- Marks, Lindsey & Olah (2026): put positive AI archetypes in training data.", "x": 19687, "y": -107, "width": 380, "height": 276, "color": "5"}, {"id": "c88a618efed4057d", "type": "text", "text": "**Sources**\n- Betley et al. (2025): the `educational-insecure` control is the precedent.\n- Turner, Soligo et al. (2025), \"Model Organisms for Emergent Misalignment\": small reproductions to test on.\n- Wang et al. (2025).", "x": 20130, "y": -58, "width": 380, "height": 228, "color": "5"}, {"id": "7c967f79b7e99aca", "type": "text", "text": "**Sources**\n- Lu et al. (2026): stabilizing the default persona.\n- Wang et al. (2025): a few hundred benign examples restore alignment.\n- Zhao et al. (2026): persona-preserving regularization; Nadaf (2026): projecting out the subspace during training; Kim et al. (2026): identity reminders after injected content.\n- Maiya et al. (2025), character training. Li et al. (2024), split-softmax.", "x": 19915, "y": 706, "width": 380, "height": 396, "color": "5"}, {"id": "0ef8c2d6f7fd5646", "type": "text", "text": "**Sources**\n- Chen et al. (2025): monitoring with persona vectors.\n- Lu et al. (2026); Wang et al. (2025); Vetter et al. (2026).\n- Chalmers (2025): thought logging, here per persona.", "x": 19486, "y": 706, "width": 380, "height": 204, "color": "5"}, {"id": "0f9aea4b8acd4e10", "type": "text", "text": "**Objections / contrasts**\n- \"Probing Persona-Dependent Preferences\" (2026): a possible failure mode for safety probes.\n- Cheng (2026): persona vectors are regime-dependent.", "x": 19666, "y": 1146, "width": 380, "height": 180, "color": "1"}, {"id": "0cd620c20ea2622b", "type": "text", "text": "**Sources**\n- Lu et al. (2026): PCA over role vectors; the leading component is the Assistant Axis.\n- Chen et al. (2025): difference-of-means persona vectors.\n- Soligo et al. (2025): convergent linear directions for misalignment.\n- Zou et al. (2023), \"Representation Engineering\": PCA on contrastive activations. Gurnee et al. (2023)", "x": 20340, "y": 704, "width": 380, "height": 372, "color": "5"}, {"id": "87f7e1fbda4bd9ca", "type": "text", "text": "**Abstract · Chapter 1: Introduction**\n\nThe early conception of Artificial Intelligence viewed intelligence as the capacity to optimize a given objective specified by its designers. This view of intelligence relies on the belief specification of a goal in code and our human understanding of that goal, coincide. This view leads to two concerns anyone operating under this view must address. 1) Many goals appear to be presentable as a simple numeric value, to increase, decrease or optimize, yet contain numerous unstated exceptions. These exceptions are general ethical or moral concerns that require subjective determination. This is known as the value specification problem. Norbert Wiener was the first to raise this concern in 1960 which was then rearticulated by Nick Bostrem in 2014 as the Orthagonality Thesis, the view that intelligence and values grow independently of each other. 2) If the goal of the model is to complete some discrete goal then there are some subgoals that any goal maximizing AI will drive towards. Self-improvement was the first of these drives examined by I.J Good in 1965, a fear which he called the “intelligence explosion”. These drives were later expanded upon by Omohundro in 2009 to include rationality, preserving the utility function, prevent counterfeit utility, self-protection, resource acquisition, and efficiency. These two problems make up what is known as the Standard Model of AI safety, and are a direct consequence of this definition of intelligence.", "x": 480, "y": -1337, "width": 620, "height": 592, "color": "4"}, {"id": "d9f195d014822f53", "type": "text", "text": "**Abstract · Chapter 2: An Alternative Objective**\n\nGiven this view of intelligence, these concerns seem inevitable. Thus the only way to avoid them seems to be to change our view of intelligence. More specifically the need for the goal to be a discrete quantity. Stuart Russell advocated for this in 2019, arguing that the model should try to optimize human preferences. This would keep the goal uncertain as more information would constantly update it. It would also ensure that the model would defer to us, side stepping the intelligence explosion, as we would be what it is trying to predict. However he suggests using ideas from social choice theory to aggregate preferences into a utility function for the model to optimize. While this seems to represent the uncertain objective, in fact the aggregation techniques impose arbitrary constraints on what the utility function represents. This can still lead to a Value Specification Problem. Despite the insufficiency of his implementation the idea itself of modeling human behavior still remains. In the same year that his book was published we saw the release of GPT-2, a model that actually tries to imitate human behavior.", "x": 3052, "y": 2194, "width": 620, "height": 472, "color": "4"}, {"id": "dca02eecacdabacc", "type": "text", "text": "**Abstract · Chapter 3: What Next-Token Prediction Requires**\n\nThe actual idea Russell was advocating for was implemented in Large Language Models (LLM). LLMs objective function is next-token prediction, which simply means predicting the next word given a series of words. To do this we train it with a large amount of text. Because language is formally representable to both humans and machines the only notion the machine has to learn is to minimize the difference between the two. It does this by minimizing the cross entropy loss between its output and the correct one. Because the goal is to predict human behavior in language, and the representation of that behavior can be formalized, at the level of pretraining there is no difference between our intended goal and the one learned by the model. This resolved the Value Specification Problem and the danger of innate drives. This alone still does not solve the issue of AI safety. Part of the reason why this approach resolves these previous concerns of AI safety is because we have widened the goal to allow for behavior that still may be undesirable in real use cases. Predicting human language means predicting potentially harmful results. To understand how to address these harmful results we must understand how the model represents them, to do that we have to inspect how the model learns or internalizes the text it's trained on.", "x": 5740, "y": -951, "width": 620, "height": 544, "color": "4"}, {"id": "f10c718b1eb0e38a", "type": "text", "text": "**Abstract · Chapter 3.5: Compression**\n\nMinimizing the cross entropy loss between the model's outputs and the text corpus is -exactly equivalent to compressing the corpus into the weights of the model. Because the number of parameters in a model is less than the number of tokens it is trained on, the model must create generalizable representations of this data. This is what allows the model to respond to out of distribution inputs. Given that the transformer architecture is sufficiently flexible to represent any complex feature of the data we can predict some features an efficient model would represent. One of these would be the notion of objective information; grammar, math, algorithms, facts about the world, analytic truths in general. This knowledge is applicable in almost every context. However most text trained on and prompts given to the model deal with what we might call subjective information. These are non-deterministic concepts like values, beliefs, opinions, etc. These concepts would vary depending on the completion. This subjective information cluster in people: Someone with x belief is likely to have y value. Thus the way the model represents subjective information is by modeling the person, AI researchers call this the persona.", "x": 9590, "y": -864, "width": 620, "height": 496, "color": "4"}, {"id": "94340a033f07f814", "type": "text", "text": "**Abstract · Chapter 4: The New Problem of Alignment**\n\nSince we are trying to prevent the model from representing subjective information in a way that is harmful to humans and persona represent that subjective information, the new task of alignment becomes limiting the influence of this harmful personas. However personas that represent anti-human values, bad advice, and prejudiced people, still play a role and carry information relevant to the model at large. In both their representation inside the mode, and in the corpus of training data, so we can not simply remove them. This is new problem of alignment", "x": 9590, "y": 1186, "width": 620, "height": 280, "color": "4"}, {"id": "14fcdd549e8fc965", "type": "text", "text": "**Abstract · Chapter 5: Alignment is not Safety**\n\nBecause we now understand LLM alignment as the issue of locating a sufficient persona to center the model around without negatively impacting the roll of other personas, we must be careful not to consider all problems of safety as problems of alignment. The personas are representations of people and not abstract values or infallible codes of ethics. If we try to force a model to never produce anything that could be considered harmful to the user this would significantly harm its overall representation of subjective information. The issues solved by alignment certainly overlap with the issues of overall safety but we cannot expect one to solve the other. Issues of safety are certainly important but, under this definition of alignment, should be processed on the final output of the mode, like sentiment analysis and should not interact with the internals of the model.", "x": 13013, "y": 2140, "width": 620, "height": 400, "color": "4"}, {"id": "90b2b633956b8c0c", "type": "text", "text": "**Abstract · Chapter 6: Current Alignment Techniques**\n\nWith this framing of alignment we can now survey the current techniques to understand their success as well as their insufficiencies. Reinforcement learning from human feedback (RLHF), which is the original and most popular technique in alignment, gets humans to select which output they prefer and uses those preferences to train the model. Supervised fine tuning (SFT) compares model responses to human writer ones and trains the model to respond more like the latter. Direct preference optimization (DPO) works like RLHF except instead of training a reward model the preferences are learned by the model directly. Each of these techniques, while they do have an impact on the model in useful ways, train only a thin layer around the model and don't interact with the internal representations. Because they only train on the outputs of the model the model can learn to create the desired output without actually internalizing the concept we are training it on. This is exactly the issue we saw with the previous conception of alignment, and the issues with Russell's idea of preference aggregation. We see examples of this in phenomena such as sycophancy and refusal behavior. This alignment is not actually dealing with the personas inside the model but training it to maximize some arbitrary function in addition to its regular next token prediction.", "x": 13066, "y": -3869, "width": 620, "height": 568, "color": "4"}, {"id": "42c18a62ef48e8d5", "type": "text", "text": "**Abstract · Chapter 7: What a Persona Is**\n\nThe compression view of LLMs is only sufficient to show the insufficiencies of current alignment techniques. In order to properly understand what actual alignment would look like we need to understand the formation and influence of personas on a deeper level. As I argued in Chapter 3 in a pre-trained model there is no difference between the intended goal and the one learned by the model, thus since the emergence of personas is a phenomenon observed inside the model the study of personas in people is relevant to the study of persona in LLMs. A persona is fundamentally a perspective, a way of viewing the world. Depending on your context, the world, and what counts as meaningful, will show up differently. This context can be defined historically, in how we consciously or unconsciously define ourselves. As well as in each instance of action, where the particular literal circumstance determines what actions are meaningful and which aren't. For the former we can turn to Heidegger's notion of Das man to understand how a background is formed. For the latter we can turn to Wittgenstein, to show that the recognition of a rule is insufficient determin its use. This deeper understanding of personas puts pressure not only on current alignment but also on our current understanding of personas. As it is described in our current literature, the personas emerge out of explicit examples of a character being described or indicated in the text. Using these philosophers we can show that the formation of these personas is far more complicated and mutliform than that. Furthermore this suggests that even the notion of “objective information” as described before is subject to being determined first by the active persona. Similar to Focualts notion of discourses, the perspective one has can determin what actually counts as knowledge and what does not. A proper approach to alignment must take this all into consideration.", "x": 15292, "y": -1454, "width": 620, "height": 760, "color": "4"}, {"id": "28df6ec4ce4a2bbd", "type": "text", "text": "**Objections / contrasts**\n- Thorstad (2024), \"Against the Singularity Hypothesis\": challenges the intelligence-explosion premise.", "x": 1650, "y": 169, "width": 380, "height": 132, "color": "1"}, {"id": "0e51f30dc6a7ee39", "type": "text", "text": "**Objections / contrasts**\n- Bender & Koller (2020), \"Climbing towards NLU\": a system trained only on form cannot learn meaning (the octopus).", "x": 5010, "y": 635, "width": 380, "height": 156, "color": "1"}], "edges": [{"id": "41619fa617ff8560", "fromNode": "f9c8a91f8d7eb7a3", "fromSide": "right", "toNode": "8e3c9c15ae7b1439", "toSide": "left"}, {"id": "8ef3100593d107a5", "fromNode": "cca3f39d2e9856e2", "fromSide": "right", "toNode": "53bc82ec5507dfb2", "toSide": "left"}, {"id": "8d2df71f03fca2ae", "fromNode": "53bc82ec5507dfb2", "fromSide": "right", "toNode": "7c4177895d37cb77", "toSide": "left"}, {"id": "19071e8425c87edd", "fromNode": "deca3a75af59ba6a", "fro
