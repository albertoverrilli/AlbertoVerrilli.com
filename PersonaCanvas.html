<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona Paper Argument - Alberto Verrilli</title>
    <link rel="icon" href="favicon-32x32.ico">
    <style>
        :root {
            --bg: #000;
            --fg: #fff;
            --muted: rgba(255, 255, 255, 0.55);
            --card: #0b0b0b;
            --edge: rgba(255, 255, 255, 0.5);
            --dot: rgba(255, 255, 255, 0.13);
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Verdana', sans-serif;
            overflow: hidden;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            z-index: 10;
            pointer-events: none;
        }

        .back-button {
            pointer-events: auto;
            padding: 8px 14px;
            background: var(--bg);
            color: var(--fg);
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85em;
            border: 2px solid var(--fg);
            box-shadow: 4px 4px 0 var(--fg);
            transition: all 0.15s;
        }

        .back-button:hover {
            background: var(--fg);
            color: var(--bg);
        }

        .top-bar h1 {
            margin: 0;
            font-size: 1em;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: var(--bg);
            padding: 6px 10px;
            border: 1px solid var(--muted);
        }

        .hint {
            position: fixed;
            left: 16px;
            bottom: 14px;
            z-index: 10;
            font-size: 0.72em;
            color: var(--muted);
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 10px;
            pointer-events: none;
        }

        /* ---------- canvas viewer ---------- */
        .cv-viewport {
            position: fixed;
            inset: 0;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            background-color: var(--bg);
            background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
        }

        .cv-viewport.cv-panning {
            cursor: grabbing;
        }

        .cv-world {
            position: absolute;
            left: 0;
            top: 0;
            transform-origin: 0 0;
            will-change: transform;
        }

        .cv-layer {
            position: absolute;
            left: 0;
            top: 0;
        }

        .cv-edges {
            position: absolute;
            overflow: visible;
            pointer-events: none;
        }

        .cv-edge {
            fill: none;
            stroke: var(--edge);
            stroke-width: 2.5;
            transition: stroke 0.15s, opacity 0.15s;
        }

        .cv-group {
            position: absolute;
            box-sizing: border-box;
            border: 2px dashed rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.035);
            cursor: move;
            transition: opacity 0.15s;
        }

        .cv-group-label {
            position: absolute;
            left: -2px;
            bottom: 100%;
            margin-bottom: 8px;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 3px;
            white-space: nowrap;
            color: var(--fg);
        }

        .cv-node {
            position: absolute;
            box-sizing: border-box;
            background: var(--card);
            border: 2px solid var(--fg);
            box-shadow: 6px 6px 0 rgba(255, 255, 255, 0.85);
            overflow: hidden;
            cursor: pointer;
            transition: opacity 0.15s, box-shadow 0.15s, transform 0.15s;
            outline: none;
        }

        .cv-node:hover {
            box-shadow: 8px 8px 0 var(--fg);
        }

        .cv-node:focus-visible {
            outline: 3px solid var(--fg);
            outline-offset: 4px;
        }

        .cv-node-body {
            padding: 14px 18px;
            font-size: 15px;
            line-height: 1.5;
            overflow-wrap: break-word;
        }

        .cv-node-body p {
            margin: 0 0 6px;
        }

        .cv-node-body p:last-child,
        .cv-node-body ul:last-child {
            margin-bottom: 0;
        }

        .cv-node-body ul {
            margin: 4px 0 6px;
            padding-left: 20px;
        }

        .cv-node-body a {
            color: var(--fg);
        }

        .cv-dragging .cv-node,
        .cv-dragging .cv-group {
            transition: none;
        }

        /* selection: dim everything that is not the selected card or its neighbours */
        .cv-has-selection .cv-node:not(.cv-selected):not(.cv-linked) {
            opacity: 0.22;
        }

        .cv-has-selection .cv-edge:not(.cv-edge-on) {
            opacity: 0.12;
        }

        .cv-has-selection .cv-group {
            opacity: 0.5;
        }

        .cv-edge.cv-edge-on {
            stroke: var(--fg);
            stroke-width: 3.5;
        }

        .cv-node.cv-selected {
            box-shadow: 0 0 0 4px var(--bg), 0 0 0 7px var(--fg), 8px 8px 0 7px var(--fg);
        }

        .cv-toolbar {
            position: fixed;
            right: 16px;
            bottom: 14px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .cv-btn {
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            background: var(--bg);
            color: var(--fg);
            border: 2px solid var(--fg);
            font: bold 0.85em 'Verdana', sans-serif;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--fg);
        }

        .cv-btn:hover {
            background: var(--fg);
            color: var(--bg);
        }

        .cv-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--fg);
        }

        .cv-error {
            margin: 120px auto;
            text-align: center;
        }

        @media (max-width: 640px) {
            .top-bar h1 {
                font-size: 0.75em;
                letter-spacing: 1px;
            }

            .hint {
                display: none;
            }

            .back-button {
                white-space: nowrap;
                padding: 6px 10px;
                font-size: 0.75em;
            }

            .cv-btn {
                min-width: 36px;
                height: 36px;
                padding: 0 9px;
            }
        }
    </style>
</head>

<body>
    <div id="canvas-root" data-src="Diagrams/Persona/argument.canvas.json"></div>

    <div class="top-bar">
        <a href="Diagrams.html" class="back-button">&larr; Diagrams</a>
        <h1>Persona Paper &mdash; Argument Map</h1>
    </div>
    <div class="hint">Drag to pan &middot; scroll or pinch to zoom &middot; drag cards to move them &middot; click a card to trace its links &middot; double-click to focus</div>

    <script src="js/canvas-viewer.js"></script>
</body>

</html>
